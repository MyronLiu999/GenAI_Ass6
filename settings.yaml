# EquityDesk settings. Every tunable lives here; nothing below is hard-coded elsewhere.
#
# MODEL. Any of:
#   provider: openai      name: gpt-4o            api_key_env: OPENAI_API_KEY
#   provider: anthropic   name: claude-sonnet-5   api_key_env: ANTHROPIC_API_KEY
#   provider: openai      name: <model>  base_url: <OpenAI-compatible endpoint>   (DeepSeek, Groq, Ollama, ...)
#   provider: scripted    (offline, deterministic, free; used by tests and demo mode)
# Every model named here needs a price line in pricing.yaml, or its cost shows as UNPRICED.
model:
  provider: openai
  name: gpt-4o
  temperature: 0.2
  max_tokens: 2500
  timeout_s: 90
  max_retries: 3          # transient errors (429 / 5xx / timeouts), exponential backoff
  api_key_env: OPENAI_API_KEY
  base_url: null

# Per-role overrides, merged onto `model`. Roles: analyst, debate, pm, qa, research. A single analyst node
# (fundamental, technical, sentiment, risk, street, earnings) can be overridden by its own name.
# Reasoning models (gpt-5.x, o3) take no temperature and spend output tokens thinking: give them
# reasoning_effort and a larger max_tokens.
# Why these two: in a side-by-side NVDA run (2026-11-11) a gpt-4o PM restated figures and failed the stale-
# estimate check, while a gpt-5.5 PM argued the earnings bar, guidance and earnings quality and passed; the
# gpt-4o earnings analyst misread $108B guidance as above a $109.0B consensus. Cost: about $0.45 -> $0.80 a run.
# For the cheaper all-gpt-4o desk, replace this block with `roles: {}`.
roles:
  pm: {name: gpt-5.5, temperature: null, reasoning_effort: medium, max_tokens: 16000, timeout_s: 300}
  earnings: {name: gpt-5.5, temperature: null, reasoning_effort: medium, max_tokens: 12000, timeout_s: 240}
  monitor: {name: gpt-4o-mini, max_tokens: 4000}   # scores and translates every headline: cheap and fast
  monitor_overview: {name: gpt-4o, max_tokens: 3000}  # the monitor's overview, every couple of hours

# Hard ceilings enforced by the harness (equitydesk/harness/llm.py) before every call.
budget:
  run_token_ceiling: 250000
  run_cost_ceiling_usd: 1.50
  qa_token_ceiling: 60000      # per follow-up question

graph:
  debate_rounds: 2             # default bull/bear rounds
  max_debate_rounds: 4         # hard cap; requests above it are clamped
  max_revisions: 1             # PM rewrites allowed when the grounding check fails
  language: English            # English | Chinese  (prose only; ids and tickers stay as-is)

grounding:
  max_ungrounded_numbers: 2    # in the PM decision; more than this fails the check
  number_rel_tolerance: 0.03
  hold_band_pct: 5.0           # track record: a HOLD is a hit if |excess return| <= this
  min_days_to_score: 5         # calls younger than this are "too early" (memory and track record)

data:
  provider: yfinance           # yfinance | fixtures
  fixtures_dir: fixtures
  history_period: 2y
  benchmark: SPY
  cache_ttl_minutes: 30
  news_limit: 10
  staleness_days: 5            # last bar older than this many days -> warning in the report
  risk_free_rate_pct: 4.0
  atr_stop_multiple: 2.0

# Web research: the desk searches the web for recent sell-side notes and independent research, keeps only
# sources the search tool actually cited (equitydesk/policy/provenance.py), and a Street Research analyst
# distils them. Needs provider openai; elsewhere the desk runs on the structured sell-side data alone.
research:
  web_search: true
  context_size: medium         # low | medium | high: how much page content the search reads (cost scales)
  max_notes: 8
  lookback_days: 60

# Market monitor: `python -m equitydesk.monitor` (or double-click start_monitor.bat) runs in the background,
# collects official releases, media, per-stock news, retail sentiment and prediction markets every minute,
# scores every item with the `monitor` model, pushes the important ones and writes short sourced reports on
# big events. A daily cost ceiling stops all model calls (collection carries on) once reached.
monitor:
  interval_s: 60
  language: Chinese
  push_min_score: 8
  push_holding_min_score: 7
  report_min_score: 8
  max_reports_per_day: 6
  daily_cost_ceiling_usd: 2.0
  overview_every_min: 120
  polymarket_queries: ["Fed decision", "recession", "tariffs"]
  kalshi_series: [KXFEDDECISION]
  notify:
    desktop: true
    ntfy_topic: ""             # set a hard-to-guess topic and subscribe to it in the ntfy phone app for phone push

paths:
  data_dir: data               # cache, SQLite stores, run traces (git-ignored)
